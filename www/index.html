<script>
const K='wakeel_v1',DAY=864e5;
let S={tasks:[],mem:[],trash:[],chat:[],voice:false,log:[],sets:[],profile:[],habits:[],flows:[],rules:'',hmsg:'',hmsgd:'',mdis:'',mplan:'',mpland:''};
try{const o=JSON.parse(localStorage.getItem(K)||'{}');for(const k in S)if(o[k]!==undefined&&typeof o[k]===typeof S[k])S[k]=o[k]}catch(e){}
S.trash=S.trash.filter(t=>Date.now()-t.at<30*DAY);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const IDB={db:null,ready:false,failed:false,t:null};
const idbOpen=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('wakeel',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('blocked'))}catch(e){no(e)}});
const idbGet=k=>new Promise((ok,no)=>{const q=IDB.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const idbPut=(k,v)=>new Promise((ok,no)=>{const tx=IDB.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>ok();tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)});
function lsSave(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('تعذّر الحفظ على الجهاز');return false}}
function flush(){clearTimeout(IDB.t);IDB.t=null;if(!IDB.db||IDB.failed)return lsSave();idbPut('state',S).catch(()=>lsSave())}
function save(){if(IDB.failed)return lsSave();if(!IDB.ready)return true;clearTimeout(IDB.t);IDB.t=setTimeout(flush,150);return true}
addEventListener('visibilitychange',()=>{if(document.hidden&&IDB.t)flush()});addEventListener('pagehide',()=>{if(IDB.t)flush()});
let tm;function toast(t){const e=$('#toast');e.textContent=t;e.className='s';clearTimeout(tm);tm=setTimeout(()=>e.className='',2600)}
const EX={busy:false,draft:null,q:'',open:null};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let tab='home',busy=false,img=null,sample=null,dl=null;
try{const th=localStorage.getItem('wakeel_theme');document.documentElement.dataset.theme=th||'dark'}catch(e){document.documentElement.dataset.theme='dark'}
const AIK=()=>{try{return localStorage.getItem('wakeel_aikey')||''}catch(e){return''}},AIM=()=>{try{return localStorage.getItem('wakeel_aimodel')||'gemini-2.5-flash'}catch(e){return'gemini-2.5-flash'}};
const f2b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no(new Error('read'));r.readAsDataURL(f)});
const upT=s=>Array.isArray(s)?s.map(upT):s&&typeof s==='object'?Object.fromEntries(Object.entries(s).map(([k,v])=>[k,k==='type'&&typeof v==='string'?v.toUpperCase():upT(v)])):s;
function mkGemini(){return async function(msgs,o){o=o||{};const key=AIK(),model=AIM();
 const contents=[];for(const m of msgs){const r=m.role==='assistant'?'model':'user',tx=String(m.content==null?'':m.content).trim();if(!tx)continue;const l=contents[contents.length-1];if(l&&l.role===r)l.parts[0].text+='\n'+tx;else contents.push({role:r,parts:[{text:tx}]})}while(contents.length&&contents[0].role!=='user')contents.shift();if(!contents.length)contents.push({role:'user',parts:[{text:'مرحبا'}]});
 if(o.images&&o.images.length){const parts=[];for(const f of o.images)parts.push({inlineData:{mimeType:f.type||'image/jpeg',data:await f2b64(f)}});contents[contents.length-1].parts.push(...parts)}
 const tl=o.tools||[],decl=tl.map(t=>{const d={name:t.name,description:t.description};if(t.inputSchema)d.parameters=upT(t.inputSchema);return d});
 let text='';
 for(let step=0;step<5;step++){
  const body={contents};if(decl.length)body.tools=[{functionDeclarations:decl}];
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  if(!res.ok){const e=new Error('HTTP '+res.status);e.status=res.status;try{const jj=await res.json();e.detail=String((jj.error&&jj.error.message)||'').replace(/AIza[\w-]+|AQ\.[\w-]+/g,'***').slice(0,200)}catch(x){}e.code=res.status===429?'rate_limited':(res.status===401||res.status===403||(res.status===400&&/api key|key not valid|API_KEY/i.test(e.detail||'')))?'bad_key':'http';throw e}
  const j=await res.json(),cand=j.candidates&&j.candidates[0],parts=(cand&&cand.content&&cand.content.parts)||[];
  const t=parts.filter(p=>p.text).map(p=>p.text).join('');if(t){text=t;o.onText&&o.onText({text})}
  const calls=parts.filter(p=>p.functionCall);if(!calls.length)break;
  contents.push({role:'model',parts});const out=[];
  for(const c of calls){const tool=tl.find(x=>x.name===c.functionCall.name);let r;try{r={result:tool?await tool.execute(c.functionCall.args||{}):'أداة غير معروفة'}}catch(e){r={error:e.message||'فشل'}}out.push({functionResponse:{name:c.functionCall.name,response:r}})}
  contents.push({role:'user',parts:out});
 }
 return {text}}}

(async()=>{try{sample=await window.claude?.use('sample')||null;dl=await window.claude?.use('downloads')||null}catch(e){}
if(!sample&&AIK())sample=mkGemini();
$('#st').textContent=sample?'🟢 الذكاء متصل':'النسخة المجانية';})();

 const hit=sc.filter(o=>o.s>0).sort((a,b)=>b.s-a.s||b.i-a.i).slice(0,n);if(hit.length>=n)return hit.map(o=>o.x);
 const ids=new Set(hit.map(o=>o.x.id));return[...hit.map(o=>o.x),...m.filter(x=>!ids.has(x.id)).slice(-Math.min(3,n-hit.length))]}
function memCtx(q,n=12){const r=relMem(q,n),tot=S.mem.length;if(!tot)return'فارغة';return r.map(x=>x.text).join(' | ')+(r.length<tot?' (عرضت '+r.length+' من '+tot+' معلومة؛ استخدم أداة search_memory للبحث في الباقي)':'')}

const _lib={};
async function blobUrl(u){let r;try{r=await fetch(u)}catch(e){throw new Error('تحميل مكتبة القراءة محتاج إنترنت أول مرة بس')}if(!r.ok)throw new Error('تعذّر تحميل مكتبة القراءة');return URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}))}
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('تعذّر تحميل مكتبة القراءة'));document.head.append(s)});
async function needLib(k){if(!_lib[k])_lib[k]=(async()=>{if(k==='xlsx'){await loadScript(await blobUrl(LIBS.xlsx));return window.XLSX}await loadScript(await blobUrl(LIBS.pdf));window.pdfjsLib.GlobalWorkerOptions.workerSrc=await blobUrl(LIBS.pdfw);return window.pdfjsLib})();try{return await _lib[k]}catch(e){delete _lib[k];throw e}}
async function readPdf(f){const L=await needLib('pdf');const d=await L.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let out='';const n=Math.min(d.numPages,30);for(let i=1;i<=n;i++){const p=await d.getPage(i),c=await p.getTextContent();out+='--- صفحة '+i+' ---\n'+c.items.map(x=>x.str).join(' ')+'\n';if(out.length>20000)break}return{text:out,pages:d.numPages}}
function sheetDraft(name,a,total){const w=Math.min(12,Math.max(...a.map(r=>r.length)));const hdr=a[0].slice(0,w).map((c,i)=>String(c).trim()||('عمود '+(i+1)));return{columns:hdr,rows:a.slice(1,201).map(r=>hdr.map((_,i)=>String(r[i]??''))),sheet:name,total,cut:a.length-1>200}}
async function readXlsx(f){const X=await needLib('xlsx');const wb=X.read(await f.arrayBuffer(),{type:'array'});for(const name of wb.SheetNames){const a=X.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));if(a.length)return sheetDraft(name,a,wb.SheetNames.length)}return null}

async function send(txt){
 const inp=$('#in');const t=(txt??inp?.value??'').trim();
 if(busy||(!t&&!img))return;
 if(!sample){toast('الذكاء غير مفعّل. أضف مفتاح API من الإعدادات');return}
 busy=true;const bot={role:'assistant',text:''};
 S.chat.push({role:'user',text:t||'(صورة)'},bot);draw();
 const el=$('#msgs').lastElementChild,tt=el.querySelector('.t');
 const ctx='أنت «وَكِيل»، مساعد شخصي ذكي. رد بالعربية بلهجة مصرية بسيطة وبإيجاز. استخدم الأدوات لتنفيذ الطلبات (إضافة مهمة، حفظ معلومة)، ولا تقل إنك نفّذت إلا لو الأداة رجّعت نجاحًا؛ ولو فشلت اشرح السبب بصدق.\nذاكرة المستخدم: '+memCtx((t||'')+' '+S.chat.slice(-12,-2).filter(x=>x.role==='user').slice(-1).map(x=>x.text).join(' '))+'\nمهامه: '+(taskCtx()||'لا يوجد');
 const hist=[];S.chat.slice(-13,-2).forEach(x=>{if(!x.text||x.text.startsWith('⚠️'))return;const r=x.role==='user'?'user':'assistant',l=hist[hist.length-1];if(l&&l.role===r)l.content+='\n'+x.text;else hist.push({role:r,content:x.text})});
 while(hist.length&&hist[0].role!=='user')hist.shift();
 const cur=ctx+'\n\nرسالة المستخدم: '+(t||'اقرأ الصورة المرفقة واستخرج منها المعلومات المفيدة.');let msgs;if(hist.length&&hist[hist.length-1].role==='user'){hist[hist.length-1].content+='\n'+cur;msgs=hist}else msgs=[...hist,{role:'user',content:cur}];
 const im=img;img=null;
 try{
  const r=await sample(msgs,{cache:false,tools:tools(bot),images:im?[im]:undefined,onText:({text})=>{bot.text=text;tt.textContent=text;$('#main').scrollTop=1e9}});
  bot.text=r.text||bot.text||'تم.';
 }catch(e){
  bot.text='⚠️ '+(e.code==='not_granted'?'لازم توافق على صلاحية الذكاء الاصطناعي عشان أرد.':e.code==='rate_limited'?'الطلبات كتير، استنى شوية وجرّب تاني.':e.code==='bad_key'?'مفتاح الـ API غلط أو غير مسموح. راجع الإعدادات.'+(e.detail?' ('+e.detail+')':''):(e.status?'خطأ '+e.status+(e.detail?': '+e.detail:''):'حصلت مشكلة مؤقتة. جرّب تبعت رسالتك تاني.'));
 }
 busy=false;S.chat=S.chat.slice(-60);save();draw();
 if(S.voice&&bot.text&&!bot.text.startsWith('⚠️'))speak(bot.text);
}

function listen(sel){sel=sel||'#in';const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('المتصفح ده لا يدعم الإدخال الصوتي');return}
 const MAP={'not-allowed':'الميكروفون ممنوع هنا من التطبيق. استخدم ميكروفون كيبورد الفون بدله.','service-not-allowed':'الميكروفون ممنوع هنا. استخدم ميكروفون الكيبورد بدله.','no-speech':'ما سمعتش صوت، جرّب تاني.','network':'التحويل لنص محتاج إنترنت.','audio-capture':'مفيش ميكروفون متاح.'};
 const go=()=>{try{const r=new R();REC=r;r.lang='ar-EG';r.continuous=false;r.interimResults=false;
  r.onresult=e=>{$(sel).value=e.results[0][0].transcript};
  r.onerror=e=>{if(e.error==='aborted')return;toast(MAP[e.error]||'تعذّر التسجيل الصوتي ('+e.error+')')};

  r.start();toast('اتكلم الآن…')}catch(e){REC=null;toast('تعذّر تشغيل الميكروفون')}};
 if(REC){const p=REC;REC=null;try{p.abort()}catch(x){}setTimeout(go,300)}else go()}

 else if(a==='iv'){const v=EX2.res&&EX2.res.inv;if(v){const html='<!doctype html><meta charset="utf-8"><html dir="rtl"><body style="font-family:sans-serif"><h2>فاتورة '+esc(v.client)+'</h2><table border="1" cellpadding="8" style="border-collapse:collapse"><tr><th>البند</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>'+v.items.map(i=>'<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td><td>'+i.price+'</td><td>'+i.qty*i.price+'</td></tr>').join('')+'</table><h3>الإجمالي: '+invTot(v)+'</h3></body></html>';(async()=>{try{if(!dl)throw 0;await dl.save({filename:'invoice.html',data:html});logOp('تنزيل فاتورة');save();toast('تم التنزيل')}catch(x){try{await navigator.clipboard.writeText(v.items.map(i=>i.name+' × '+i.qty+' = '+i.qty*i.price).join('\n')+'\nالإجمالي: '+invTot(v));toast('التنزيل غير متاح. اتنسخت الفاتورة كنص.')}catch(y){toast('تعذّر التنزيل')}}})()}}

 else if(a==='cgo')runCmd();
 else if(a==='cx')execCmd();
 else if(a==='cck'){EX3.acts[+id].on=b.checked?1:0}
 else if(a==='bpl')askBrain('p');
 else if(a==='bq')askBrain('q');
 else if(a==='iimg')$('#fib').click();
 else if(a==='im')$('#fi').click();
 else if(a==='fm'){if(!S.profile.length)toast('أضف بياناتك أولًا من تبويب الذاكرة');else $('#ff').click()}

document.addEventListener('change',e=>{
 if(e.target.id==='fib'&&e.target.files[0]){EX3.img=e.target.files[0];e.target.value='';draw();toast('تم إرفاق الصورة');return}
 if(e.target.id==='fdi'&&e.target.files[0]){EX2.img=e.target.files[0];e.target.value='';draw();toast('تم إرفاق الصورة');return}
 if(e.target.id==='ff'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';extract(f,true);return}
 if(e.target.id==='fu'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';extract(f);return}
 if(e.target.id==='fp'&&e.target.files[0]){img=e.target.files[0];toast('تم إرفاق الصورة. اكتب سؤالك واضغط إرسال')}
 if(e.target.id==='fvi'&&e.target.files[0]){const rd=new FileReader();rd.onload=()=>{try{vImport(JSON.parse(rd.result))}catch(x){toast('ملف الخزنة غير صالح')}};rd.readAsText(e.target.files[0]);e.target.value='';return}
 if(e.target.id==='fi'&&e.target.files[0]){const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);let n=0;for(const k of['tasks','mem','trash','sets','profile']){if(!Array.isArray(o[k]))continue;const ids=new Set(S[k].map(x=>x.id));o[k].forEach(x=>{if(x&&x.id&&!ids.has(x.id)){S[k].push(x);n++}})}save();draw();toast('تم دمج '+n+' عنصر')}catch(x){toast('الملف غير صالح')}};rd.readAsText(e.target.files[0])}
});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='fh'){const n=$('#hn').value.trim();if(n){S.habits.push({id:uid(),name:n,time:$('#ht').value||'',done:{},created:Date.now()});logOp('عادة جديدة: '+n);save();draw()}return}
 if(e.target.id==='fp2'){const k=$('#pk').value.trim(),v=$('#pv').value.trim();if(k&&v){S.profile.push({id:uid(),k,v});logOp('بيانات شخصية: '+k);save();draw()}return}
 if(e.target.id==='ft'){const v=$('#ti').value.trim();if(v){S.tasks.push({id:uid(),text:v,done:false});logOp('إضافة مهمة: '+v);save();draw();$('#ti').focus()}}
 if(e.target.id==='fm'){const v=$('#mi').value.trim();if(v){S.mem.push({id:uid(),text:v});save();draw();toast('اتحفظت في الذاكرة')}}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.r!==undefined&&EX.draft)EX.draft.rows[+t.dataset.r][+t.dataset.c]=t.value;
 else if(t.dataset.h!==undefined&&EX.draft)EX.draft.columns[+t.dataset.h]=t.value;
 else if(t.id==='dtt'&&EX.draft)EX.draft.title=t.value;
 else if(t.id==='dt')EX2.text=t.value;
 else if(t.id==='ct')EX3.text=t.value;
 else if(t.id==='bq')EX5.q=t.value;
 else if(t.dataset.ci!==undefined&&EX3.acts)EX3.acts[+t.dataset.ci].text=t.value;
 else if(t.id==='rl'){S.rules=t.value;save()}
 else if(t.id==='sq'){EX.q=t.value;draw();const q=$('#sq');q.focus();q.setSelectionRange(q.value.length,q.value.length)}});

 if(e.key==='Enter'&&e.target.id==='in'){e.preventDefault();send()}});
